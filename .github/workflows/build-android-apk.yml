name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu-latest runner already includes the Android SDK.
      # Avoid android-actions/setup-android@v3 here: it invokes the removed
      # legacy SDK package "tools", causing sdkmanager to exit with code 1.
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/cmdline-tools" || { echo "Android command-line tools not found at $ANDROID_HOME"; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: her-voice-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
